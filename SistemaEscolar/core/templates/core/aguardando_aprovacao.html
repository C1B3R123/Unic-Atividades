{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h1 class="display-1 text-warning mb-4"><i class="bi bi-clock-history"></i></h1>
            <h2 class="fw-bold mb-3">Aguardando Aprovação</h2>
            <p class="text-muted mb-4">Seu cadastro como professor foi recebido. Um diretor ou administrador revisara seu perfil em breve. Por favor, aguarde a aprovacao para acessar as funcionalidades do sistema.</p>
            <a href="{% url 'logout' %}" class="btn btn-outline-secondary">Sair do Sistema</a>
        </div>
    </div>
</div>
{% endblock %}
